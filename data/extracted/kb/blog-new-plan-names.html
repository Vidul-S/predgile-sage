<body><h1>Introducing Starter, Pro and Scale</h1>
<p>From 1 March 2025, Basic becomes Starter and Business becomes Scale. Pro keeps its name.</p>
<p>We are also raising API rate limits: Starter 100, Pro 1,000 and Scale 5,000 requests per minute.</p>
